name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proj/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  app:
    name: App (Flutter web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proj/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.4"
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --dart-define=API_BASE_URL=http://localhost:8080 --dart-define=API_KEY=ci
