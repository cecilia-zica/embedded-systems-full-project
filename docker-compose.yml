services:
  backend:
    build: ./proj/backend
    ports:
      - "8080:8080"
    # Named volume (not a bind mount) because the container runs as a non-root
    # user: the Dockerfile chowns /data to the app user, which wouldn't work
    # with a host folder. The SQLite data survives `docker compose down`.
    volumes:
      - backend-data:/data
    environment:
      - DB_PATH=/data/app.db
      # API_KEY and ALLOWED_ORIGIN default in the code (zica123 / "*").
      # In production, set a strong key and lock CORS to the app's domain:
      # - API_KEY=change-this-key
      # - ALLOWED_ORIGIN=https://your-app.example.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  backend-data:
